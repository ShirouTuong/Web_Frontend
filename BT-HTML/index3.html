<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liên kết yêu thích</title>
</head>
<body>

    <!-- Tiêu đề <h1> -->
    <h1>Liên kết yêu thích của tôi</h1>

    <!-- Danh sách không có thứ tự (<ul>) chứa các liên kết -->
    <ul>
        <!-- Liên kết 1: Mở trong tab mới (target="_blank") -->
        <li>
            <a href="https://www.google.com" target="_blank">Trang tìm kiếm Google</a>
        </li>

        <!-- Liên kết 2: Dẫn đến file HTML khác trong cùng thư mục (about.html) -->
        <li>
            <a href="about.html">Trang Giới thiệu (About)</a>
        </li>

        <!-- Liên kết 3: Dẫn đến email (mailto:) -->
        <li>
            <a href="mailto:example@gmail.com">Gửi email cho tôi</a>
        </li>
    </ul>

</body>
</html>
